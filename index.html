<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GUESS ARCADE - Jeux de devinette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app hub">
    <header class="hub-head">
      <h1 class="title hub-title">GUESS<br>ARCADE</h1>
      <p class="hub-sub">Choisis ton jeu</p>
    </header>

    <main class="hub-grid">
      <a class="hub-tile motus" href="motus.html">
        <span class="hub-emoji" aria-hidden="true">A_C</span>
        <span class="hub-text">
          <span class="hub-name">MOTUS</span>
          <span class="hub-desc">Devine le mot mystere</span>
        </span>
      </a>
      <a class="hub-tile poke" href="pokedle.html">
        <span class="hub-emoji" aria-hidden="true">PKM</span>
        <span class="hub-text">
          <span class="hub-name">POKEDLE</span>
          <span class="hub-desc">Devine le Pokemon (Gen 1 a 9)</span>
        </span>
      </a>
      <a class="hub-tile lol" href="loldle.html">
        <span class="hub-emoji" aria-hidden="true">LOL</span>
        <span class="hub-text">
          <span class="hub-name">LOLDLE</span>
          <span class="hub-desc">5 modes : classique, citation, competence, emoji, splash</span>
        </span>
      </a>
      <a class="hub-tile mob" href="mobdle.html">
        <span class="hub-emoji" aria-hidden="true">MC</span>
        <span class="hub-text">
          <span class="hub-name">MOBDLE</span>
          <span class="hub-desc">Devine le mob Minecraft</span>
        </span>
      </a>
    </main>
  </div>

  <div id="particles"></div>
</body>
</html>
